name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify plugin snapshot matches the skill source
        run: node scripts/build-plugin.mjs --check

      - name: Run repository checks
        run: node scripts/check-repo.mjs
